# 푸시·PR마다 백엔드 테스트와 화면·Tauri 빌드 검사를 돌린다. 설치 파일은 만들지 않는다(scripts/build_app.ps1로 로컬에서).
# (공통 파일: 네 앱이 같은 내용을 쓴다. 앱 고유 검사는 extra.yml. docs/STRUCTURE.md)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  app:
    name: App (oxlint · tsc · vite · cargo check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # build.rs가 빈 백엔드 폴더를 만들어 주므로 PyInstaller 없이도 검사된다
      - run: cargo check --locked
        working-directory: app/src-tauri
